map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream api {
    server api:4000;
}

upstream web_informante {
    server web-informante:80;
}

upstream web_verificador {
    server web-verificador:80;
}

server {
    listen 80;
    server_name api.clavesegura.com;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name informante.clavesegura.com;

    location / {
        proxy_pass http://web_informante;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name verificador.clavesegura.com;

    location / {
        proxy_pass http://web_verificador;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}