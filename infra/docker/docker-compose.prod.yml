services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clave-segura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clave-segura-net

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clave-segura-net

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      URL_DOCS: ${URL_DOCS:-http://localhost:4000/docs}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE}
      STELLAR_SOURCE_PUBLIC: ${STELLAR_SOURCE_PUBLIC:-}
      STELLAR_SOURCE_SECRET: ${STELLAR_SOURCE_SECRET:-}
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - clave-segura-net

  web-informante:
    build:
      context: ../..
      dockerfile: apps/web-informante/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clave-segura-net

  web-verificador:
    build:
      context: ../..
      dockerfile: apps/web-verificador/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clave-segura-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - api
      - web-informante
      - web-verificador
    networks:
      - clave-segura-net

volumes:
  clave-segura-pgdata:

networks:
  clave-segura-net:
    driver: bridge
