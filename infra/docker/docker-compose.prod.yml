services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clave-segura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clave-segura-net

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "prisma:migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clave-segura-net

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - clave-segura-net

  web-informante:
    build:
      context: ../..
      dockerfile: apps/web-informante/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clave-segura-net

  web-verificador:
    build:
      context: ../..
      dockerfile: apps/web-verificador/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clave-segura-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - api
      - web-informante
      - web-verificador
    networks:
      - clave-segura-net

volumes:
  clave-segura-pgdata:

networks:
  clave-segura-net:
    driver: bridge
