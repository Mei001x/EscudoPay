services:
  postgres:
    image: postgres:16-alpine
    container_name: clave-segura-postgres
    environment:
      POSTGRES_USER: clave_segura
      POSTGRES_PASSWORD: clave_segura
      POSTGRES_DB: clave_segura
    ports:
      - "5433:5432"
    volumes:
      - clave-segura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clave_segura -d clave_segura"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    container_name: clave-segura-api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://clave_segura:clave_segura@postgres:5432/clave_segura?schema=public
      CI: "true"
    ports:
      - "4000:4000"
    volumes:
      - ../..:/workspace
      - clave-segura-node-modules:/workspace/node_modules
    command: ["sh", "-c", "if [ ! -x apps/api/node_modules/.bin/ts-node-dev ]; then pnpm install --filter api... --frozen-lockfile; fi && pnpm --filter api prisma:generate && pnpm --filter api dev"]
    depends_on:
      postgres:
        condition: service_healthy

  web-informante:
    build:
      context: ../..
      dockerfile: apps/web-informante/Dockerfile.dev
    container_name: clave-segura-web-informante
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ../..:/workspace
      - clave-segura-informante-root-modules:/workspace/node_modules
      - clave-segura-informante-app-modules:/workspace/apps/web-informante/node_modules

  web-verificador:
    build:
      context: ../..
      dockerfile: apps/web-verificador/Dockerfile.dev
    container_name: clave-segura-web-verificador
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5174:5174"
    volumes:
      - ../..:/workspace
      - clave-segura-verificador-root-modules:/workspace/node_modules
      - clave-segura-verificador-app-modules:/workspace/apps/web-verificador/node_modules

volumes:
  clave-segura-pgdata:
  clave-segura-node-modules:
  clave-segura-informante-root-modules:
  clave-segura-informante-app-modules:
  clave-segura-verificador-root-modules:
  clave-segura-verificador-app-modules:
